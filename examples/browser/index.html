<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOMOS TS – Browser Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <header class="px-6 py-4 border-b border-slate-800 bg-slate-950 text-slate-200">
      <h2 class="text-xl font-semibold">NOMOS TS – Browser Demo</h2>
      <p class="text-slate-400 text-sm">Flows, tool calling, decisions, and local persistence via OpenAI (server-side). Your API key remains on the server.</p>
    </header>
    <main class="grid md:grid-cols-[1fr_420px] gap-4 p-4 bg-slate-950 text-slate-100 min-h-screen">
      <section class="flex flex-col rounded-lg border border-slate-800 bg-slate-900/60 min-h-[60vh]">
        <div id="chat" class="flex-1 p-4 space-y-2 overflow-auto"></div>
        <div id="input" class="flex gap-2 p-3 border-t border-slate-800 sticky bottom-0 bg-slate-900/80">
          <input id="text" type="text" class="flex-1 rounded-md border border-slate-700 bg-slate-800/80 px-3 py-2 text-slate-100 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Type a message (e.g., ‘start booking’ or ‘what’s the time?’)" />
          <button id="send" class="rounded-md border border-slate-700 bg-indigo-600 hover:bg-indigo-500 px-4 py-2 text-white">Send</button>
          <button id="reset" class="rounded-md border border-slate-700 bg-slate-800 hover:bg-slate-700 px-3 py-2">Reset</button>
        </div>
      </section>
      <aside class="rounded-lg border border-slate-800 bg-slate-900/60 p-4 space-y-4">
        <div>
          <h3 class="text-lg font-semibold">Session</h3>
          <div class="mt-2 grid grid-cols-2 gap-2 text-sm">
            <div class="text-slate-400">Current Step</div>
            <div id="step" class="font-medium text-slate-200">?</div>
            <div class="text-slate-400">Flow</div>
            <div id="flow" class="font-medium text-slate-200">-</div>
          </div>
        </div>
        <div>
          <h3 class="text-lg font-semibold">Last Decision</h3>
          <pre id="decision" class="mt-2 text-xs p-3 rounded-md bg-slate-950 border border-slate-800 whitespace-pre-wrap"></pre>
        </div>
        <div>
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-semibold">Event Log</h3>
            <button id="clearDebug" class="text-xs px-2 py-1 rounded border border-slate-700 hover:bg-slate-800">Clear</button>
          </div>
          <div id="events" class="mt-2 space-y-2 max-h-[40vh] overflow-auto"></div>
        </div>
      </aside>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
  </html>
