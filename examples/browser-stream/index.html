<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barista Streaming Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <header class="px-4 py-3 border-b border-slate-800">
      <h1 class="text-lg font-semibold text-center">Barista (Streaming)</h1>
      <p class="text-slate-400 text-sm text-center">Compact chat with reasoning, actions, tool calls, and streamed responses.</p>
    </header>
    <main class="container mx-auto max-w-2xl p-3">
      <section class="flex flex-col rounded border border-slate-800 bg-slate-900/60 min-h-[70vh]">
        <div id="chat" class="flex-1 p-3 space-y-3 overflow-auto"></div>
        <div class="flex gap-2 p-2 border-t border-slate-800">
          <input id="text" type="text" class="flex-1 rounded-md border border-slate-700 bg-slate-800/80 px-3 py-2 text-slate-100 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Type a message (e.g., ‘Hello’ or ‘small espresso’) and press Enter" />
          <button id="send" class="rounded-md border border-slate-700 bg-indigo-600 hover:bg-indigo-500 px-3 py-2 text-white">Send</button>
          <button id="reset" class="rounded-md border border-slate-700 bg-slate-800 hover:bg-slate-700 px-3 py-2">Reset</button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
  </html>
